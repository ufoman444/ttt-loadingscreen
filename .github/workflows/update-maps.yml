# ══════════════════════════════════════════════════════════════════════════
# MAP-INDEX AUTOMATISCH AKTUELL HALTEN
#
# Liest die Workshop-Sammlung jede Nacht neu aus und aktualisiert js/maps.json.
# Nimmst du eine Map in die Sammlung auf, hat sie am nächsten Tag von selbst
# ein Vorschaubild — ohne dass du etwas tust.
#
# WELCHE SAMMLUNG?
#   1. Die Repository-Variable COLLECTION_ID, falls gesetzt
#      (Settings → Secrets and variables → Actions → Variables).
#      Mehrere IDs durch Leerzeichen trennen.
#   2. Sonst die IDs, die in js/maps.json unter "sammlungen" stehen — die
#      schreibt das Skript beim Erzeugen selbst hinein. In aller Regel ist
#      also nichts zu konfigurieren.
#   3. Findet sich beides nicht, wird der Lauf übersprungen. Das ist kein
#      Fehler: Wer den Index nicht nutzt, soll keine roten Läufe bekommen.
#
# Damit der Commit klappt, muss unter Settings → Actions → General bei
# "Workflow permissions" der Schreibzugriff aktiv sein.
# ══════════════════════════════════════════════════════════════════════════

name: Map-Index aktualisieren

on:
  schedule:
    - cron: '17 4 * * *'      # täglich 04:17 UTC
  workflow_dispatch:           # und auf Knopfdruck

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sammlungs-ID ermitteln
        id: sammlung
        env:
          COLLECTION_ID: ${{ vars.COLLECTION_ID }}
        run: |
          IDS="$COLLECTION_ID"

          # Ohne Variable: die IDs nehmen, die im Index selbst vermerkt sind.
          if [ -z "$IDS" ] && [ -f js/maps.json ]; then
            IDS=$(node -e "try{const d=require('./js/maps.json');process.stdout.write((d.sammlungen||[]).join(' '))}catch(e){}")
            [ -n "$IDS" ] && echo "Sammlungs-ID aus js/maps.json übernommen: $IDS"
          fi

          if [ -z "$IDS" ]; then
            echo "::notice::Keine Sammlungs-ID gefunden — Lauf übersprungen. Setze die Variable COLLECTION_ID, wenn der Map-Index automatisch aktualisiert werden soll."
            echo "ueberspringen=true" >> "$GITHUB_OUTPUT"
          else
            echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          fi

      - name: Index neu erzeugen
        if: steps.sammlung.outputs.ueberspringen != 'true'
        run: node scripts/fetch-workshop-maps.mjs ${{ steps.sammlung.outputs.ids }}

      - name: Index prüfen
        # Meldet nicht erreichbare Bilder mit Exit 1. Der Bericht im Log ist
        # auch dann lesenswert, wenn alles in Ordnung war — deshalb darf ein
        # Fehlschlag hier den Lauf nicht rot färben.
        if: steps.sammlung.outputs.ueberspringen != 'true'
        run: node scripts/check-workshop-maps.mjs
        continue-on-error: true

      - name: Änderungen committen
        if: steps.sammlung.outputs.ueberspringen != 'true'
        run: |
          if git diff --quiet -- js/maps.json; then
            echo "Keine Änderungen an der Sammlung — nichts zu tun."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/maps.json
          git commit -m "chore: Map-Index aus der Workshop-Sammlung aktualisiert"
          git push
